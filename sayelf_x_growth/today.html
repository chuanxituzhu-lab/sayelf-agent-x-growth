<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X TODAY · Old Guy Lab</title><link rel="icon" type="image/png" href="/assets/sayelf-logo.png">
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui;color:#eaf0f5;background:#101820}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:36px auto;padding:0 24px}h1{font-size:42px;line-height:1.1;margin:4px 0}h2{font-size:23px}h3{margin:0 0 12px}.eyebrow{color:#73dbbe;letter-spacing:2px;font-size:12px}.muted{color:#a3b5c5}.brand{display:flex;align-items:center;gap:16px;margin:12px 0 20px}.brand img{width:76px;height:76px;object-fit:cover;border:1px solid #526372;border-radius:50%}.brand-label{color:#a3b5c5;font-size:13px}.banner{border-left:3px solid #73dbbe;padding:12px 18px;background:#192630;margin:24px 0}input,select,textarea{background:#101820;color:#eaf0f5;border:1px solid #526372;border-radius:7px;padding:9px;width:100%;font:inherit}textarea{min-height:95px;resize:vertical}label{display:block;font-size:14px;color:#b7c8d5;margin:9px 0}input[type=checkbox]{width:auto}button{background:#73dbbe;color:#10231d;border:0;border-radius:7px;padding:10px 16px;font:inherit;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#2b3c49;color:#eaf0f5}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:16px;align-items:end}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:22px;border:1px solid #344958;border-radius:12px;background:#17232d;margin:16px 0}.post{white-space:pre-wrap;font-size:19px;margin:14px 0}.tag{display:inline-block;background:#284338;border-radius:4px;padding:3px 8px;font-size:12px;margin:0 5px 6px 0}.blocked{background:#563530}details{margin:14px 0}.panel{border-top:1px solid #344958;padding:14px 0}.panel>summary{font-weight:600}#run{margin:0;padding:13px 22px}#automation{font-size:14px}.grid .card{margin:6px 0 16px}summary{cursor:pointer;color:#abc2d3}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}#notice{position:sticky;top:0;padding:10px;background:#193c32;display:none;z-index:1}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{display:block}h1{font-size:34px}.brand img{width:64px;height:64px}}
</style><main>
<div id="notice" role="status"></div><button id="language" class="secondary" style="float:right">English</button><header class="brand"><img src="/assets/sayelf-logo.png" alt="SAYELF 山野精灵"><div><div class="eyebrow">SAYELF / 山野精灵</div><h1>X TODAY</h1><div class="brand-label">OLD GUY LAB / L2</div></div></header>
<p class="muted">把真实工作，变成值得分享的两条内容。</p>
<div class="banner">当前为本地演练。草稿、证据和复盘保存在本机；真实 X 发布尚未连接。</div>
<button id="run">推荐今天最值得发的内容</button><p id="automation" class="muted"></p>
<details class="panel"><summary>账号与审核设置</summary><div class="row"><label>账号<input id="account" value="OldGuyLab" maxlength="15"></label><label>日期<input id="day" type="date"></label><label>审核人<input id="actor" placeholder="你的姓名"></label><label>热点地区<select id="region"><option value="Tokyo">Tokyo / 东京</option><option value="Worldwide">WORLDWIDE / 全球</option></select></label></div></details>
<h2>今天的推荐 <span id="count" class="muted"></span></h2><div id="recommended" class="grid"></div>
<h2>待审核素材</h2><div id="drafts" class="grid"></div>
<details class="panel"><summary>补充素材与证据</summary><div class="grid"><section class="card"><h3>输入一条真实工作</h3><label>类型<select id="kind"><option value="BUILD">Build</option><option value="DEMO">Demo</option><option value="FAILURE">Failure → Fix</option><option value="INSIGHT">Insight</option><option value="HUMAN">Human</option><option value="QUOTE">Quote 草稿</option><option value="THREAD">Thread 草稿</option></select></label><label>亲历观察 / 具体结果<textarea id="text" placeholder="发生了什么？有哪些证据？"></textarea></label><label>陈述性质<select id="label"><option>Observation</option><option>Fact</option><option>Opinion</option><option>Inference</option><option>Hypothesis</option></select></label><label>证据 ID<input id="evidence-id" placeholder="先登记证据，再填入返回的 ID"></label><label>内容分级<select id="classification"><option>Unknown</option><option>Internal</option><option>Public</option><option>Sensitive</option><option>Restricted</option></select></label><label><input type="checkbox" id="trend"> 涉及热点（始终需要人工批准）</label><label><input type="checkbox" id="original"> 来自我的真实原创工作</label><button id="intake">准备草稿</button></section>
<section class="card"><h3>登记本机证据</h3><p class="muted">UTF-8 文本文件；摘录必须出现在原文件中。原文件变化后，草稿会重新阻断。</p><label>文件完整路径<input id="path"></label><label>支持陈述的原文摘录<textarea id="excerpt"></textarea></label><label>证据分级<select id="eclass"><option>Unknown</option><option>Internal</option><option>Public</option><option>Sensitive</option><option>Restricted</option></select></label><button id="evidence">登记证据</button><p id="e-result" class="muted"></p></section></div>
</details>
<details class="panel"><summary>发布演练与复盘</summary><h2>发布演练与复盘</h2><p class="muted">2h / 24h / 72h 按发布时刻生成待办。无可用数据留空；点赞不参与学习。</p><button id="due" class="secondary">执行已到期的本地发布演练</button><div id="publications"></div>
</details>
<details class="panel"><summary>本地运行状态与待办</summary><pre id="health"></pre></details>
</main><script nonce="__TOKEN__">
const csrf='__TOKEN__',dims=['Originality','Evidence','Insight','Conversation','Clarity','Hook','Brand Fit'];
let language=localStorage.getItem('x-today-language')||'zh';
const words={
'把真实工作，变成值得分享的两条内容。':'Turn real work into two worthwhile content choices.',
'当前为本地演练。草稿、证据和复盘保存在本机；真实 X 发布尚未连接。':'Local rehearsal. Drafts, evidence and learning stay on this computer. Live X publishing is not connected.',
'推荐今天最值得发的内容':'Generate today’s best content choices','今天的推荐':'Today’s recommendations','输入一条真实工作':'Add real work','登记本机证据':'Register local evidence','热点地区':'Trend region','账号':'Account','日期':'Date','审核人':'Reviewer','类型':'Type',
'亲历观察 / 具体结果':'Firsthand observation / result','陈述性质':'Claim label','证据 ID':'Evidence ID','内容分级':'Classification','涉及热点（始终需要人工批准）':'Trend related (human approval required)','来自我的真实原创工作':'From my original work','准备草稿':'Prepare draft',

'文件完整路径':'Full file path','支持陈述的原文摘录':'Supporting source excerpt','证据分级':'Evidence classification','登记证据':'Register evidence','待审核素材':'Draft choices for review','发布演练与复盘':'Publication rehearsal and learning',
'2h / 24h / 72h 按发布时刻生成待办。无可用数据留空；点赞不参与学习。':'2h / 24h / 72h follow-ups start from publication. Leave unavailable metrics blank. Likes do not guide learning.',
'执行已到期的本地发布演练':'Run due local publication rehearsals','本地运行状态与待办':'Local status and tasks','今天暂无通过审核的推荐。可以不发。':'No eligible recommendation today. Posting is optional.',
'热点 · 人工决策':'Trend context · human decision','证据、陈述与审核':'Evidence, claims and review','所有事实陈述均已标注，无遗漏':'All factual claims are labelled','证据支持这些陈述，推断与观点已区分':'Evidence supports claims; inference and opinion are separate',
'确认可公开，已检查隐私、版权与平台合规':'Reviewed for public sharing, privacy, copyright and policy','来自真实原创工作，未编造经历':'Original work; no fabricated experience','保存审核与评分':'Save review and scores','自动评分依据结构特征，仅供建议；语义质量需人工审核。':'Scores use structural features. Meaning and quality require human review.',
'编辑草稿（需要重新审核）':'Edit draft (new review required)','陈述标签 JSON':'Claim labels JSON','内容':'Content','保存修改':'Save edit','批准本地演练':'Approve local rehearsal','暂缓':'Hold','拒绝':'Reject','恢复待审核':'Return to review','执行本地发布演练':'Run local publication rehearsal','排期（日本时间 UTC+9）':'Schedule (Japan UTC+9)','保存演练排期':'Save rehearsal schedule',
'发布时刻（日本时间）：':'Published at (Japan): ','采集窗口':'Observation window','数据来源说明':'Metric source','观测时刻（ISO；演练可使用未来时刻）':'Observed at (ISO; future time allowed for rehearsal)','保存窗口数据':'Save window metrics','生成学习假设':'Generate learning hypothesis','评分 ':'Score ','理由：证据与本地质量门槛通过；发布前需人工审核':'Evidence and local quality gates passed; review before publication','原因：':'Reasons: ',
'你的姓名':'Your name','发生了什么？有哪些证据？':'What happened? What evidence supports it?','先登记证据，再填入返回的 ID':'Register evidence first, then enter its ID','Quote 草稿':'Quote draft','Thread 草稿':'Thread draft'};
Object.assign(words,{'账号与审核设置':'Account and reviewer settings','补充素材与证据':'Add work and evidence','提问讨论':'Question angle','开发记录':'Build narrative','热点匹配（仅供参考）：':'Matched trend context: '});
const originals=new WeakMap();
function translate(){const walker=document.createTreeWalker(document.querySelector('main'),NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement.closest('.post,pre,textarea,#language,#notice,#automation'))continue;if(!originals.has(n))originals.set(n,n.nodeValue);let text=originals.get(n);if(language==='en')for(const [zh,en] of Object.entries(words).sort((a,b)=>b[0].length-a[0].length))text=text.replaceAll(zh,en);if(n.nodeValue!==text)n.nodeValue=text;}document.querySelectorAll('[placeholder]').forEach(e=>{e.dataset.originalPlaceholder??=e.placeholder;e.placeholder=language==='en'?(words[e.dataset.originalPlaceholder]||e.dataset.originalPlaceholder):e.dataset.originalPlaceholder});$('language').textContent=language==='zh'?'English':'中文';document.documentElement.lang=language==='zh'?'zh-CN':'en';}
const $=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
let data;
$('day').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function notice(text){if(language==='en')text=text.replaceAll('已保存到本机','Saved locally').replaceAll('尚未执行：','Not completed: ').replaceAll('请填写审核人','Enter a reviewer name');$('notice').textContent=text;$('notice').style.display='block'}
async function action(value){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(value)});const v=await r.json();if(v.code)throw Error(v.msg);notice('已保存到本机');await refresh();return v.data}catch(e){notice('尚未执行：'+e.message);throw e}}
function actor(){const value=$('actor').value.trim();if(!value)throw Error('请填写审核人');return value}
function button(parent,text,fn,secondary=true){const b=node('button',text);if(secondary)b.className='secondary';b.onclick=()=>Promise.resolve().then(fn).catch(e=>notice(e.message));parent.append(b);return b}
function field(parent,title,tag='input',value=''){const label=node('label',title),n=node(tag);n.value=value;label.append(n);parent.append(label);return n}
function card(d){const c=node('article');c.className='card';c.append(node('h3',d.variant==='QUESTION'?'提问讨论':'开发记录'));if(d.matched_trends?.length)c.append(node('p','热点匹配（仅供参考）：'+d.matched_trends.join(' / ')));const tag=node('span',d.state+' · '+d.gate.state);tag.className='tag'+(d.gate.state==='BLOCKED'?' blocked':'');c.append(tag);if(d.trend)c.append(node('span','热点 · 人工决策'));const p=node('div',d.text);p.className='post';c.append(p);c.append(node('p',`评分 ${d.gate.score} / 100 · ${d.gate.state==='PASS'?'理由：证据与本地质量门槛通过；发布前需人工审核':'原因：'+d.gate.reasons.join(' / ')}`));
 const details=node('details'),summary=node('summary','证据、陈述与审核');details.append(summary,node('pre',JSON.stringify({claims:d.claims,evidence_ids:d.evidence_ids,revision:d.revision},null,2)));const scores=node('div');scores.className='scores';const inputs={};dims.forEach(k=>{const n=field(scores,k,'input',d.scores[k]??'');n.type='number';n.min=0;n.max=100;inputs[k]=n});details.append(scores);const flags={};[['claims_complete','所有事实陈述均已标注，无遗漏'],['evidence_checked','证据支持这些陈述，推断与观点已区分'],['compliance_checked','确认可公开，已检查隐私、版权与平台合规'],['original_work','来自真实原创工作，未编造经历']].forEach(([k,t])=>{const l=node('label'),n=node('input');n.type='checkbox';n.checked=d.review.actor!=='local-structural-gate'&&d.review[k]===true;l.append(n,document.createTextNode(' '+t));details.append(l);flags[k]=n});button(details,'保存审核与评分',()=>action({op:'review',id:d.id,actor:actor(),scores:Object.fromEntries(dims.map(k=>[k,Number(inputs[k].value)])),attestations:Object.fromEntries(Object.keys(flags).map(k=>[k,flags[k].checked]))}),false);details.append(node('p','自动评分依据结构特征，仅供建议；语义质量需人工审核。'));c.append(details);
 const edit=node('details');edit.append(node('summary','编辑草稿（需要重新审核）'));const text=field(edit,'内容','textarea',d.text),claims=field(edit,'陈述标签 JSON','textarea',JSON.stringify(d.claims,null,2));button(edit,'保存修改',()=>action({op:'decision',id:d.id,actor:actor(),decision:'EDIT',text:text.value,claims:JSON.parse(claims.value)}));c.append(edit);
 if(['RECOMMENDED','APPROVED'].includes(d.state)&&d.gate.state==='PASS'&&d.review.actor!=='local-structural-gate')button(c,'批准本地演练',()=>action({op:'decision',id:d.id,actor:actor(),decision:'APPROVE'}),false);
 if(!['PUBLISHED','SIMULATED','UNKNOWN','PUBLISHING'].includes(d.state)){button(c,'暂缓',()=>action({op:'decision',id:d.id,actor:actor(),decision:'HOLD'}));button(c,'拒绝',()=>action({op:'decision',id:d.id,actor:actor(),decision:'REJECT'}));}
 if(d.state==='HELD')button(c,'恢复待审核',()=>action({op:'resume',id:d.id}));
 if(d.state==='APPROVED'){button(c,'执行本地发布演练',()=>action({op:'publish',id:d.id}),false);const when=field(c,'排期（日本时间 UTC+9）','input');when.type='datetime-local';button(c,'保存演练排期',()=>action({op:'schedule',id:d.id,due_at:new Date(when.value+'+09:00').toISOString()}));}return c}
function publication(p){const c=node('section');c.className='card';c.append(node('h3',p.state+' · '+p.id),node('p','发布时刻（日本时间）：'+new Date(p.published_at).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'})));const w=field(c,'采集窗口','select');[2,24,72].forEach(h=>{const n=node('option',h+'h');n.value=h;w.append(n)});const fields={};['replies','quotes','profile_visits','follow_conversions','negative_signals'].forEach(k=>{const n=field(c,k,'input');n.type='number';n.min=0;fields[k]=n});const source=field(c,'数据来源说明','input',p.state==='SIMULATED'?'offline simulation':'manual account analytics');const stamp=field(c,'观测时刻（ISO；演练可使用未来时刻）','input');button(c,'保存窗口数据',()=>action({op:'observe',id:p.id,hours:Number(w.value),metrics:Object.fromEntries(Object.keys(fields).map(k=>[k,fields[k].value===''?null:Number(fields[k].value)])),source:source.value,observed_at:stamp.value||undefined}));button(c,'生成学习假设',()=>action({op:'learn',id:p.id}));const observations=data.observation.filter(o=>o.publication_id===p.id),learning=data.learning.find(l=>l.publication_id===p.id);c.append(node('pre',JSON.stringify({observations,learning},null,2)));return c}
async function refresh(){const r=await fetch('/api/today'),v=await r.json();if(v.code)throw Error(v.msg);data=v.data;const account=$('account').value,day=$('day').value;const run=data.daily.find(r=>r.id===account+':'+day);const ids=run?.visible_ids||[];const candidates=data.draft.filter(d=>d.account===account&&d.day===day);$('count').textContent=candidates.filter(d=>ids.includes(d.id)&&d.gate.state==='PASS'&&['RECOMMENDED','APPROVED'].includes(d.state)).length+' / 2';$('recommended').replaceChildren(...candidates.filter(d=>ids.includes(d.id)&&d.gate.state==='PASS'&&['RECOMMENDED','APPROVED'].includes(d.state)).map(card));if(!$('recommended').children.length)$('recommended').append(node('p','今天暂无通过审核的推荐。可以不发。'));$('drafts').replaceChildren(...candidates.filter(d=>!ids.includes(d.id)||d.gate.state!=='PASS'||!['RECOMMENDED','APPROVED'].includes(d.state)).map(card));$('publications').replaceChildren(...data.publication.filter(p=>candidates.some(d=>d.id===p.draft_id)).map(publication));$('health').textContent=JSON.stringify({health:data.health,due_tasks:data.due_tasks,daily:run},null,2)}
$('run').onclick=async()=>{const b=$('run');b.disabled=true;notice(language==='zh'?'正在匹配工作素材并生成候选内容…':'Matching work and preparing content choices…');try{const result=await action({op:'run',account:$('account').value,day:$('day').value,region:$('region').value});notice(language==='zh'?`已准备 ${result.draft_ids.length} 种候选写法；通过门槛后供人工选择。`:`Prepared ${result.draft_ids.length} content choices for human review.`)}catch(e){}finally{b.disabled=false;translate()}};
$('language').onclick=()=>{language=language==='zh'?'en':'zh';localStorage.setItem('x-today-language',language);translate();renderAutomation()};
function stateName(code){const labels={TRENDS_NOT_CONFIGURED:['待配置官方读取授权','Official read access not configured'],NOT_CONFIGURED:['未连接','Not connected'],AVAILABLE:['已有工作素材','Work available'],NO_FRESH_WORK:['暂无新工作素材','No new work'],READY:['已读取','Available'],CONNECTED:['已连接','Connected'],TRENDS_UNAVAILABLE:['暂时无法读取','Read unavailable']};return labels[code]?.[language==='zh'?0:1]||code;}
function renderAutomation(){const s=data?.automation?.find(v=>v.id===$('account').value+':'+$('day').value);$('automation').textContent=s?(language==='zh'?`每天 08:00 自动准备 · 当前 ${s.draft_ids.length} 种写法 · 热点 ${s.trends.region}：${stateName(s.trends.state)} · ${stateName(s.source_state)} · Agent Ops：${stateName(s.agent_ops.state)} · 当前使用本地结构化写法`:`Daily preparation at 08:00 · ${s.draft_ids.length} choices · ${s.trends.region} trends: ${stateName(s.trends.state)} · ${stateName(s.source_state)} · Agent Ops: ${stateName(s.agent_ops.state)} · Local structural framing`):(language==='zh'?'每天 08:00 东京时间自动准备；内容发布仍需人工批准。':'Daily preparation at 08:00 Tokyo time; publishing requires human approval.');}
const originalRefresh=refresh;refresh=async()=>{await originalRefresh();renderAutomation();translate()};
$('evidence').onclick=()=>{try{action({op:'evidence',path:$('path').value,excerpt:$('excerpt').value,classification:$('eclass').value,actor:actor()}).then(e=>{$('evidence-id').value=e.id;$('e-result').textContent='证据 ID：'+e.id}).catch(()=>{})}catch(e){notice(e.message)}};
$('intake').onclick=()=>{const text=$('text').value,label=$('label').value,eid=$('evidence-id').value.trim();action({op:'intake',account:$('account').value,day:$('day').value,signal:{kind:$('kind').value,text,classification:$('classification').value,trend:$('trend').checked,original_work:$('original').checked,evidence_ids:eid?[eid]:[],claims:[{label,text,evidence_id:eid,basis:eid?[eid]:[]}]}}).catch(()=>{})};
$('due').onclick=()=>action({op:'due'}).catch(()=>{});$('account').onchange=refresh;$('day').onchange=refresh;translate();refresh().then(()=>{if(!data.automation.some(s=>s.id===$('account').value+':'+$('day').value))$('run').click()}).catch(e=>notice(e.message));
</script></html>
